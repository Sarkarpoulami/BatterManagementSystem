# Netlify deployment configuration
# Matches the site build settings: build with Vite, publish the dist folder.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: always serve the built index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
